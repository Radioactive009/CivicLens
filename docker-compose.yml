services:
  db:
    image: postgres:16-alpine
    container_name: civiclens_db
    environment:
      POSTGRES_DB: ${DB_NAME:-civiclens}
      POSTGRES_USER: ${DB_USER:-civiclens}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-civiclens_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-civiclens} -d ${DB_NAME:-civiclens}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civiclens_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: civiclens_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-civiclens-dev-secret-key-prod-random-987456}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-civiclens}
      DB_USER: ${DB_USER:-civiclens}
      DB_PASSWORD: ${DB_PASSWORD:-civiclens_secret}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: civiclens_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-civiclens-dev-secret-key-prod-random-987456}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-civiclens}
      DB_USER: ${DB_USER:-civiclens}
      DB_PASSWORD: ${DB_PASSWORD:-civiclens_secret}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: civiclens_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:

